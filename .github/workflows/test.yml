name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q --cov=sop_screen --cov-report=term-missing --cov-fail-under=98
      - name: Every number the README quotes is still produced by the code
        run: python scripts/check_claims.py
      - name: The suite runs with no credentials and never imports boto3
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import sop_screen
          from sop_screen.model import BedrockClient, StubClient
          assert "boto3" not in sys.modules, "boto3 must not be imported at package import"
          assert isinstance(StubClient({}), sop_screen.VisionClient)
          BedrockClient(client=object()).request_body(b"x" * 32, "p", ".jpg")
          print("offline ok: stub and request construction need no boto3")
          PY
