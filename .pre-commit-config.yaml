repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: readme-claims-still-hold
        name: every number and identifier the README cites is still real
        entry: python scripts/check_claims.py
        language: system
        pass_filenames: false
      - id: tests
        name: tests
        entry: python -m pytest -q
        language: system
        pass_filenames: false
